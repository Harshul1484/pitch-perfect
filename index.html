<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the page reaches under a notch; the safe-area
         insets in index.css keep the controls out from under it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Perfect Pitch</title>

    <!-- Installable. The manifest names the app, gives it its icon, and asks
         for landscape — which, in the installed app, the system provides,
         so the rotation in index.css is only for the browser tab. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e4e4df" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pitch Perfect" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
