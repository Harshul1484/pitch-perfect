<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The product mark, as an app icon: three bars rising to a red one — the
    pitch meter at the moment you are sharp, small enough to sign a page with.
    The bars sit inside the central 80% so the icon survives every mask shape
    a launcher applies; the ground fills the whole square for the same reason.
  -->
  <rect width="512" height="512" fill="#fafafa"/>
  <g>
    <rect x="163" y="290" width="46" height="96" rx="6" fill="#2b2b2b"/>
    <rect x="233" y="226" width="46" height="160" rx="6" fill="#2b2b2b"/>
    <rect x="303" y="140" width="46" height="246" rx="6" fill="#ff3b30"/>
  </g>
</svg>
